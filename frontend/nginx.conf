server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/ { set $api kibaru-backend:8081; proxy_pass http://$api$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
 location = /ngsw-worker.js { expires -1; }
 location = /ngsw.json { expires -1; }
 location = /manifest.webmanifest { default_type application/manifest+json; expires -1; }
 location ~* \.(?:js|css|woff2)$ { expires 1y; }
 location = /index.html { expires -1; }
 location / { try_files $uri $uri/ /index.html; }
}
